/* OPDeck engine 0.5.0-ref (porting JS di engine.py/effects.py/sim.py). Regole base + DSL; effetti non coperti => carta NON implementata. */
const ENGINE_VERSION="0.7.0-ref";
class Rng{constructor(s){this.x=BigInt.asUintN(64,BigInt(s))}

  if(e.action==="power_turn"&&!(g.attacksAllowed()&&!P.leader.rested))return false}return true},
 main(g,p){const P=g.pl[p],O=g.pl[1-p];

  for(const c of evs.sort((a,b)=>b.cost-a.cost)){if(c.cost<=P.act&&P.hand.indexOf(c)>=0&&this.useful(g,p,c)){g.playEvent(p,c);if(g.winner!==null)return}}
  if(!g.attacksAllowed())return;
  for(const u of [P.leader,...P.field].sort((a,b)=>b.d.power-a.d.power)){
   if(!g.canAttack(P,u))continue;
   const pw=g.power(u,true),room=P.act*1000,lead=O.leader,lp=g.power(lead,false);
   const kills=O.field.filter(x=>x.rested&&pw+room>=g.power(x,false)),faceOk=pw+room>=lp;let tgt;
   if(faceOk&&O.life.length<=2)tgt=lead;else if(kills.length)tgt=maxBy(kills,x=>x.d.cost*1e6+x.d.power);else if(faceOk)tgt=lead;else continue;
   const need=Math.max(0,Math.ceil((g.power(tgt,false)-pw)/1000)),extra=tgt===lead?Math.min(P.act-need,2):0;
   g.attachDon(P,u,need+Math.max(0,extra));g.attack(p,u,tgt);if(g.winner!==null)return}},
 block(g,d,apw,tgt,bl){if(tgt!==g.pl[d].leader||!bl.length)return null;
  if(g.pl[d].life.length<=1)return minBy(bl,u=>u.d.power);
  const ok=bl.filter(u=>u.d.power>apw);return ok.length?minBy(ok,u=>u.d.power):null},
 counter(g,d,apw,tgt,tpw){const P=g.pl[d],deficit=apw-tpw+1;if(deficit<=0)return[];
  const cs=P.hand.filter(c=>(c.type==="CHARACTER"&&c.counter>0)||(c.type==="EVENT"&&cval(c)>0&&c.cost<=P.act)),one=cs.filter(c=>cval(c)>=deficit);
  let pick=one.length?[minBy(one,c=>cval(c)*100+c.cost)]:[];
  if(!pick.length){let tot=0,budget=P.act;for(const c of [...cs].sort((a,b)=>(cval(b)-cval(a))||(a.cost-b.cost))){
    if(c.type==="EVENT"){if(c.cost>budget)continue;budget-=c.cost}pick.push(c);tot+=cval(c);if(tot>=deficit)break}if(tot<deficit)return[]}
  if(tgt===P.leader)return(P.life.length<=2||pick.length===1)?pick:[];
  return(tgt.d.cost>=4&&pick.length===1)?pick:[]}};
class Game{
 constructor(leaders,decks,seed,first=0,pol=[Heuristic,Heuristic]){this.rng=new Rng(seed);this.first=first;this.t=0;this.winner=null;this.reason=null;this.pol=pol;
  this.pl=[0,1].map(i=>new Player(leaders[i],decks[i]));for(const P of this.pl)this.rng.shuffle(P.deck);for(const P of this.pl)this.draw(P,5);
  for(const i of [first,1-first]){const P=this.pl[i];if(this.pol[i].mulligan(P.hand)){P.deck.push(...P.hand);P.hand=[];this.rng.shuffle(P.deck);this.draw(P,5)}}
  for(const P of this.pl)P.seen=new Set(P.hand.map(c=>c.id));for(const P of this.pl)for(let k=0;k<P.leader.d.life;k++)P.life.push(P.deck.shift())}
 draw(P,n=1){for(let i=0;i<n;i++){const c=P.deck.shift();P.hand.push(c);if(c)P.seen.add(c.id)}}
 attacksAllowed(){return this.t>2}
 power(u,mine){return u.d.power+(mine?1000*u.don:0)+u.bonus}
 canAttack(P,u){return !u.rested&&(u===P.leader||u.tp<this.t||u.d.rush)}
 trashUnit(P,u){rm(P.field,u);P.trash.push(u.d);P.rst+=u.don;u.don=0}
 playCharacter(p,c){const P=this.pl[p];P.act-=c.cost;P.rst+=c.cost;rm(P.hand,c);P.field.push(new Unit(c,this.t));this.fire(p,c,"on_play")}

  for(const e of d.effects){if(e.trigger!==trig||this.winner!==null)continue;if(e.min_don&&(unit===null||unit.don<e.min_don))continue;

   else if(e.action==="don_add"){const n=Math.min(e.n,P.donDeck,10-P.donOnField());P.donDeck-=n;if(e.mode==="rest")P.rst+=n;else P.act+=n}
   else if(e.action==="rest_opp"){const t=O.field.filter(u=>!u.rested&&u.d.cost<=e.max_cost);if(t.length)maxBy(t,u=>u.d.cost*1e6+u.d.power).rested=true}
   else if(e.action==="ko_opp_rested"){const t=O.field.filter(u=>u.rested&&u.d.cost<=e.max_cost);if(t.length)this.trashUnit(O,maxBy(t,u=>u.d.cost*1e6+u.d.power))}
   else if(e.action==="power_turn")P.leader.bonus+=e.n
   else if(e.action==="ko_opp"||e.action==="ko_opp_power"){const t=O.field.filter(u=>e.action==="ko_opp"?u.d.cost<=e.max_cost:u.d.power<=e.max_power);

/* ---- DSL effetti (port di effects.py) ---- */
const Q="['’]",FXHEAD=/^(?:\[DON!! x(\d+)\] )?\[(On Play|When Attacking|Trigger|Main|Counter)\] /,TRIG={"On Play":"on_play","When Attacking":"when_attacking","Trigger":"trigger","Main":"main","Counter":"counter"},KW={"Blocker":"blocker","Rush":"rush","Double Attack":"double_attack","Banish":"banish"};

const FXACT=[[/^Draw (\d+) cards?\./,m=>({action:"draw",n:+m[1]})],

 [new RegExp(`^K\\.O\\. up to 1 of your opponent${Q}s Characters with a cost of (\\d+) or less\\.`),m=>({action:"ko_opp",max_cost:+m[1]})],
 [new RegExp(`^K\\.O\\. up to 1 of your opponent${Q}s Characters with (\\d+) power or less\\.`),m=>({action:"ko_opp_power",max_power:+m[1]})]];

 [/^Up to 1 of your Leader or Character cards gains \+(\d+) power during this battle\./,m=>({action:"power_battle",n:+m[1]})],
 [new RegExp(`^Rest up to 1 of your opponent${Q}s Characters with a cost of (\\d+) or less\\.`),m=>({action:"rest_opp",max_cost:+m[1]})],
 [new RegExp(`^K\\.O\\. up to 1 of your opponent${Q}s rested Characters with a cost of (\\d+) or less\\.`),m=>({action:"ko_opp_rested",max_cost:+m[1]})]);
const fxNorm=t=>(t||"").replace(/This card has been officially errata'd\./g,"").replace(/Under the rules of this game, you may have any number of this card in your deck\./g,"").replace(/\([^)]*\)/g,"").split(/\s+/).filter(Boolean).join(" ");

 outer:while(t){let m=t.match(/^\[(Blocker|Rush|Double Attack|Banish)\]\s*/);if(m){kws.add(KW[m[1]]);t=t.slice(m[0].length);continue}
  const h=t.match(FXHEAD);if(h&&!(h[1]&&h[2]!=="When Attacking")){const rest=t.slice(h[0].length);
   for(const[rx,f]of FXACT){const a=rest.match(rx);if(a){const kw=f(a);if((h[2]==="Counter")!==(kw.action==="power_battle"))continue;effs.push(eff({trigger:TRIG[h[2]],min_don:+(h[1]||0),...kw}));t=rest.slice(a[0].length).replace(/^\s+/,"");continue outer}}}

async function runSuite(cards,deckA,opps,n,seed,tick){const A=buildDeck(cards,deckA.leader,deckA.cards),res=[];

 for(let round=1;round<=o.rounds&&fails<2;round++){
  try{
   const dl={};for(const x of contrib(base.rs.map(x=>x.r)))dl[x.id]=x.d;
   const outs=Object.keys(cur).sort((a,b)=>(dl[a]??0)-(dl[b]??0)).slice(0,10);

/* ---- Playtest solo (stile "Solo vs Self"): regole automatiche, effetti risolti a mano ---- */
let PT=null;
const ptDef=c=>{const t=c.text||"";return{id:c.card_number,name:c.name,type:c.type,cost:c.cost||0,power:c.power||0,counter:c.counter||0,life:c.life||0,text:t,colors:c.colors,
 blocker:/\[Blocker\]/.test(t),rush:/\[Rush\]/.test(t),dbl:/\[Double Attack\]/.test(t),banish:/\[Banish\]/.test(t),effects:[]}};
const ptLog=m=>{PT.log.push(m);if(PT.log.length>40)PT.log.shift()};
const ptUnit=(p,z,i)=>z==="leader"?PT.pl[p].leader:PT.pl[p].field[i];
function ptCardAt(p,z,i){const P=PT.pl[p];return z==="leader"||z==="field"?ptUnit(p,z,i).d:P[z][i]}
function ptStart(){const A=getDeck($("#pa").value),B=getDeck($("#pb").value);if(!A||!B||!A.leader||!B.leader)return alert("Seleziona due mazzi.");
 for(const d of[A,B])if(Object.values(d.cards).reduce((x,y)=>x+y,0)!==50)return alert("Ogni mazzo deve avere 50 carte.");
 const seed=+$("#ps").value||(Date.now()%1000000000),rng=new Rng(seed),memo={},df=n=>memo[n]||(memo[n]=ptDef(S.cards[n]));
 const pl=[A,B].map(d=>new Player(df(d.leader),Object.entries(d.cards).flatMap(([k,q])=>Array(q).fill(df(k)))));
 for(const P of pl){rng.shuffle(P.deck);for(let i=0;i<5;i++)P.hand.push(P.deck.shift());P.stage=[]}
 PT={pl,rng,t:0,cur:0,first:rng.below(2),log:[],sel:null,battle:null,trig:null,view:null,winner:null,setup:true,mull:[false,false],ign:false,seed};
 ptLog(`Seed ${seed}. Parte il giocatore ${PT.first+1}. Mulligan (una volta per giocatore), poi "Inizia partita".`);renderPT()}
function ptMull(p){if(PT.mull[p])return;const P=PT.pl[p];PT.mull[p]=true;P.deck.push(...P.hand);P.hand=[];PT.rng.shuffle(P.deck);for(let i=0;i<5;i++)P.hand.push(P.deck.shift());ptLog(`Giocatore ${p+1}: mulligan`);renderPT()}
function ptGo(){for(const P of PT.pl)for(let k=0;k<P.leader.d.life;k++)P.life.push(P.deck.shift());PT.setup=false;ptBegin(PT.first)}
function ptBegin(p){const P=PT.pl[p];PT.t++;PT.cur=p;for(const u of[P.leader,...P.field]){P.rst+=u.don;u.don=0;u.rested=false}P.act+=P.rst;P.rst=0;
 if(PT.t>1){if(!P.deck.length){PT.winner=1-p;ptLog("Mazzo vuoto: vince il giocatore "+(2-p));return renderPT()}P.hand.push(P.deck.shift())}
 const n=Math.min(PT.t===1?1:2,P.donDeck,10-P.donOnField());P.donDeck-=n;P.act+=n;ptLog(`Turno ${PT.t}: giocatore ${p+1}`);renderPT()}
function ptEnd(){if(!PT||PT.setup||PT.battle||PT.trig||PT.winner!==null)return;for(const P of PT.pl)for(const u of[P.leader,...P.field])u.bonus=0;ptBegin(1-PT.cur)}
function ptSel(p,z,i){PT.sel={p,z,i};renderPT()}
function ptTake(P,z,i){if(z==="field"){const u=P.field.splice(i,1)[0];P.rst+=u.don;return u.d}return P[z].splice(i,1)[0]}
function ptPut(P,to,c){if(to==="deckTop")P.deck.unshift(c);else if(to==="deckBottom")P.deck.push(c);else if(to==="lifeTop")P.life.unshift(c);else if(to==="field")P.field.push(new Unit(c,PT.t));else P[to].push(c)}
function ptMove(p,z,i,to){const P=PT.pl[p];ptPut(P,to,ptTake(P,z,i));PT.sel=null;renderPT()}
function ptPlay(p,i){const P=PT.pl[p],c=P.hand[i];if(c.cost>P.act)return alert("DON!! attivi insufficienti.");
 if(c.type==="CHARACTER"&&P.field.length>=5)return alert("Campo pieno: manda prima un Character al cimitero.");
 P.act-=c.cost;P.rst+=c.cost;P.hand.splice(i,1);PT.sel=null;
 if(c.type==="CHARACTER")P.field.push(new Unit(c,PT.t));else if(c.type==="STAGE"){if(P.stage.length)P.trash.push(P.stage.pop());P.stage.push(c)}else P.trash.push(c);
 ptLog(`G${p+1} gioca ${c.name}${c.text?" — RISOLVI A MANO: "+c.text:""}`);renderPT()}
function ptUnitAct(k,n){const s=PT.sel;if(!s)return;const P=PT.pl[s.p],u=ptUnit(s.p,s.z,s.i);
 if(k==="rest")u.rested=!u.rested;else if(k==="att"){if(P.act>0){P.act--;u.don++}}else if(k==="det"){if(u.don>0){u.don--;P.rst++}}else if(k==="bonus")u.bonus+=n;renderPT()}
function ptDon(k){const P=PT.pl[PT.sel?PT.sel.p:PT.cur];
 if(k==="add"&&P.donDeck>0&&P.donOnField()<10){P.donDeck--;P.act++}else if(k==="wake"&&P.rst>0){P.rst--;P.act++}else if(k==="ret"&&P.act>0){P.act--;P.donDeck++}renderPT()}
function ptDraw(p){const P=PT.pl[p];if(!P.deck.length){PT.winner=1-p;ptLog("Mazzo vuoto: vince il giocatore "+(2-p))}else P.hand.push(P.deck.shift());renderPT()}
function ptView(p,z,n){PT.view=z?{p,z,n:n||99}:null;renderPT()}
function ptVMove(i,to){const v=PT.view;ptPut(PT.pl[v.p],to,ptTake(PT.pl[v.p],v.z,i));renderPT()}
function ptAtkStart(){const s=PT.sel;if(!s||s.p!==PT.cur||PT.battle||PT.trig||PT.winner!==null||(s.z!=="leader"&&s.z!=="field"))return;const u=ptUnit(s.p,s.z,s.i);
 if(PT.t<=2)return alert("Nessun attacco al primo turno di ciascun giocatore.");if(u.rested)return alert("L'unità è a riposo.");
 if(s.z==="field"&&u.tp>=PT.t&&!u.d.rush&&!PT.ign)return alert("Appena giocato: non può attaccare (se un effetto concede Rush, attiva 'Ignora restrizioni').");
 PT.battle={p:s.p,u,step:"target",dmg:u.d.dbl?2:1,ban:u.d.banish,extra:0,tgt:null};PT.sel=null;renderPT()}
function ptTarget(z,i){const b=PT.battle,D=PT.pl[1-b.p];b.u.rested=true;b.tgt=z==="leader"?D.leader:D.field[i];b.step="block";ptLog(`G${b.p+1} attacca ${b.tgt.d.name} con ${b.u.d.name}`);renderPT()}
function ptBlock(i){const b=PT.battle,D=PT.pl[1-b.p];if(i>=0){const u=D.field[i];u.rested=true;b.tgt=u;ptLog("Blocca: "+u.d.name)}b.step="counter";renderPT()}
function ptCounter(i){const b=PT.battle,D=PT.pl[1-b.p],c=D.hand.splice(i,1)[0];D.trash.push(c);b.extra+=c.counter;renderPT()}
function ptCounterEv(i){const b=PT.battle,D=PT.pl[1-b.p],c=D.hand[i];if(c.cost>D.act)return alert("DON!! attivi insufficienti.");
 const v=parseInt(prompt("Potere aggiunto da questo Counter (leggi il testo):","2000"));if(isNaN(v))return;D.act-=c.cost;D.rst+=c.cost;D.hand.splice(i,1);D.trash.push(c);b.extra+=v;renderPT()}
function ptBat(k,v){const b=PT.battle;if(k==="x")b.extra+=v;else if(k==="dmg")b.dmg=v;else if(k==="ban")b.ban=!b.ban;renderPT()}
function ptResolve(){const b=PT.battle,D=PT.pl[1-b.p],apw=b.u.d.power+1000*b.u.don+b.u.bonus,tpw=b.tgt.d.power+b.tgt.bonus+b.extra;PT.battle=null;
 ptLog(`Battaglia ${apw} vs ${tpw}: ${apw>=tpw?"colpisce":"fallisce"}`);
 if(apw>=tpw){if(b.tgt===D.leader)ptDamage(1-b.p,b.dmg,b.ban);else{D.field.splice(D.field.indexOf(b.tgt),1);D.trash.push(b.tgt.d);D.rst+=b.tgt.don;ptLog("K.O.: "+b.tgt.d.name)}}renderPT()}
function ptDamage(d,n,ban){const D=PT.pl[d];while(n>0){if(!D.life.length){PT.winner=1-d;ptLog("VITTORIA giocatore "+(2-d));return}
 const c=D.life.shift();n--;if(ban){D.trash.push(c);continue}if(/\[Trigger\]/.test(c.text)){PT.trig={d,c,n,ban};return}D.hand.push(c)}}
function ptTrig(use){const T=PT.trig,D=PT.pl[T.d];PT.trig=null;if(use){D.trash.push(T.c);ptLog(`Trigger di ${T.c.name} — RISOLVI A MANO: ${T.c.text}`)}else D.hand.push(T.c);ptDamage(T.d,T.n,T.ban);renderPT()}
const ptChip=(p,z,i,c,x="",rs=false)=>`<span class="chip ${PT.sel&&PT.sel.p===p&&PT.sel.z===z&&PT.sel.i===i?"on":""} ${rs?"rs":""}" onclick="ptSel(${p},'${z}',${i})" title="${esc(c.text)}">${esc(c.name)} <small>${c.type[0]} ${c.cost}c ${c.power||""}${c.counter?" +"+c.counter:""}${x}</small></span>`;
const ptB=(l,f,dis)=>`<button class="b" ${dis?"disabled":""} onclick="${f}">${l}</button>`;
function ptHTML(){if(!PT)return'<p class="mu">Scegli due mazzi e premi Avvia.</p>';
 const side=p=>{const P=PT.pl[p],u=(x,z,i)=>ptChip(p,z,i,x.d,(x.rested?" ⟳":"")+(x.don?` DON×${x.don}`:"")+(x.bonus?` +${x.bonus}`:""),x.rested);
  return`<div class="card" ${PT.cur===p&&!PT.setup?'style="outline:2px solid var(--ac)"':""}><b>Giocatore ${p+1}</b> · Vita ${P.life.length} · Mazzo ${P.deck.length} · Cimitero ${P.trash.length} · DON!! attivi ${P.act} / riposo ${P.rst} / mazzo ${P.donDeck}
  <div>Leader: ${u(P.leader,"leader",0)}</div><div>Campo: ${P.field.map((x,i)=>u(x,"field",i)).join("")||"—"} ${P.stage.map((c,i)=>ptChip(p,"stage",i,c)).join("")}</div><div>Mano: ${P.hand.map((c,i)=>ptChip(p,"hand",i,c)).join("")||"—"}</div>
  <div class="row">${ptB("Cimitero",`ptView(${p},'trash')`)}${ptB("Top 5",`ptView(${p},'deck',5)`)}${ptB("Top 10",`ptView(${p},'deck',10)`)}${ptB("Vita",`ptView(${p},'life')`)}${ptB("Pesca",`ptDraw(${p})`)}</div></div>`};
 let h=PT.winner!==null?`<div class="card"><b class="o">Vince il giocatore ${PT.winner+1}</b></div>`:"";
 h+=side(1)+side(0);
 if(PT.setup)return h+`<div class="card row">${[0,1].map(p=>ptB(`Mulligan G${p+1}`,`ptMull(${p})`,PT.mull[p])).join("")}${ptB("Inizia partita","ptGo()")}</div>`+ptLogHTML();
 const s=PT.sel;let bar="";
 if(s){const c=ptCardAt(s.p,s.z,s.i),own=s.p===PT.cur;
  bar=`<div class="mu"><b>${esc(c.name)}</b> ${c.id} · ${c.type} · ${(c.colors||[]).join("/")} · costo ${c.cost} · potere ${c.power} · counter ${c.counter} · vita ${c.life}<br>${esc(c.text)}</div><div class="row">`;
  if(s.z==="hand")bar+=ptB("Gioca",`ptPlay(${s.p},${s.i})`)+["trash:Cimitero","deckBottom:Fondo mazzo","deckTop:Cima mazzo"].map(x=>ptB(x.split(":")[1],`ptMove(${s.p},'hand',${s.i},'${x.split(":")[0]}')`)).join("");
  else if(s.z==="leader"||s.z==="field")bar+=(own?ptB("Attacca","ptAtkStart()"):"")+ptB("Riposo/Attiva","ptUnitAct('rest')")+ptB("+1 DON!!","ptUnitAct('att')")+ptB("−1 DON!!","ptUnitAct('det')")+ptB("+1000 turno","ptUnitAct('bonus',1000)")+(s.z==="field"?["trash:K.O.","hand:In mano","deckBottom:Fondo mazzo"].map(x=>ptB(x.split(":")[1],`ptMove(${s.p},'field',${s.i},'${x.split(":")[0]}')`)).join(""):"");
  else bar+=["trash:Cimitero","hand:In mano"].map(x=>ptB(x.split(":")[1],`ptMove(${s.p},'${s.z}',${s.i},'${x.split(":")[0]}')`)).join("");
  bar+="</div>"}
 h+=`<div class="card">${bar||'<span class="mu">Clicca una carta per vederne il testo e le azioni.</span>'}<div class="row">${ptB("Termina turno","ptEnd()")}${ptB("DON!! +1 dal mazzo","ptDon('add')")}${ptB("DON!! riposo→attivo","ptDon('wake')")}${ptB("DON!! −1 nel mazzo","ptDon('ret')")}
  <label><input type="checkbox" ${PT.ign?"checked":""} onchange="PT.ign=this.checked"> Ignora restrizioni d'attacco (effetti)</label></div></div>`;
 const b=PT.battle;if(b){const A=b.p,D=PT.pl[1-A];h+=`<div class="card"><b>Battaglia</b> — ${esc(b.u.d.name)} (potere ${b.u.d.power+1000*b.u.don+b.u.bonus}) · `;
  if(b.step==="target")h+=`scegli il bersaglio: <div class="row">${ptB("Leader avversario",`ptTarget('leader',0)`)}${D.field.map((x,i)=>x.rested?ptB(esc(x.d.name),`ptTarget('field',${i})`):"").join("")}${ptB("Annulla","PT.battle=null;renderPT()")}</div>`;
  else if(b.step==="block")h+=`blocco di G${2-A}: <div class="row">${D.field.map((x,i)=>x.d.blocker&&!x.rested?ptB("Blocca con "+esc(x.d.name),`ptBlock(${i})`):"").join("")}${ptB("Nessun blocco","ptBlock(-1)")}</div>`;
  else h+=`bersaglio ${esc(b.tgt.d.name)} potere ${b.tgt.d.power+b.tgt.bonus+b.extra} (counter ${b.extra}) · danni ${b.dmg}${b.ban?" · Banish":""}<div class="row">Counter G${2-A}: ${D.hand.map((c,i)=>c.counter?ptB(`${esc(c.name)} +${c.counter}`,`ptCounter(${i})`):c.type==="EVENT"&&/\[Counter\]/.test(c.text)?ptB(`${esc(c.name)} (Event, ${c.cost}c)`,`ptCounterEv(${i})`):"").join("")}${ptB("+1000","ptBat('x',1000)")}${ptB("Danni 1","ptBat('dmg',1)")}${ptB("Danni 2","ptBat('dmg',2)")}${ptB("Banish","ptBat('ban')")}${ptB("Risolvi","ptResolve()")}</div>`;h+="</div>"}
 if(PT.trig)h+=`<div class="card"><b>Trigger</b> di G${PT.trig.d+1}: ${esc(PT.trig.c.name)} — ${esc(PT.trig.c.text)}<div class="row">${ptB("Attiva (poi al cimitero)","ptTrig(true)")}${ptB("Aggiungi alla mano","ptTrig(false)")}</div></div>`;
 if(PT.view){const v=PT.view,P=PT.pl[v.p],L=P[v.z].slice(0,v.n);h+=`<div class="card"><b>${v.z==="deck"?"Cima del mazzo":v.z==="life"?"Vita (cima per prima)":"Cimitero"} G${v.p+1}</b> ${ptB("Chiudi","ptView()")}<table>${L.map((c,i)=>`<tr><td>${esc(c.name)} <small class="mu">${c.id} ${esc(c.text).slice(0,70)}</small></td><td>${[["hand","Mano"],["deckBottom","Fondo"],["deckTop","Cima"],["trash","Cimitero"],["field","Campo"],["lifeTop","Vita"]].map(([t,l])=>ptB(l,`ptVMove(${i},'${t}')`)).join("")}</td></tr>`).join("")}</table></div>`}
 return h+ptLogHTML()}

<div class="card"><h4>Aggiungi decklist</h4><div class="row"><input id="mn" placeholder="Nome archetipo"><input id="ms" placeholder="Fonte (URL)" style="flex:1;min-width:200px"><input id="md" type="date" value="${today()}"><input id="mw" type="number" min="0" step="0.1" placeholder="Peso %" style="width:90px"></div><textarea id="mt" rows="6" style="width:100%" placeholder="1xOP01-001&#10;4xOP01-016"></textarea><div class="row"><button class="b p" onclick="metaAdd()">Aggiungi dal testo</button></div><div class="row"><select id="mv">${Object.keys(S.saved).map(k=>`<option>${esc(k)}</option>`).join("")}</select><button class="b" onclick="metaFromSaved()">Aggiungi un mazzo salvato</button></div></div>`}
function metaAdd(){const nm=$("#mn").value.trim(),src=$("#ms").value.trim(),dt=$("#md").value;if(!nm||!src||!dt)return alert("Servono nome, fonte e data.");
 const d=parseDeck($("#mt").value);if(!d.leader||d.n!==50||d.err.length)return alert(`Rifiutata: Leader ${d.leader||"mancante"}, carte ${d.n}/50`+(d.err.length?`, righe non valide: ${d.err.slice(0,5).join(" | ")}`:""));
 S.meta.push({name:nm,leader:d.leader,cards:d.main,source:src,date:dt,weight:+$("#mw").value||0});sv("meta",S.meta);render()}

function prep(d,allow,out){if(!d||!d.leader){alert("Seleziona un mazzo.");return null}if(!S.meta.length){alert("Il Meta è vuoto: aggiungi almeno un avversario nella sezione Meta.");return null}
 if(Object.values(d.cards).reduce((a,b)=>a+b,0)!==50){alert("Il mazzo deve avere 50 carte.");return null}
 const miss=[d,...S.meta].flatMap(x=>[x.leader,...Object.keys(x.cards)]).filter(k=>!S.cards[k]);if(miss.length){alert("Carte non presenti nel database: "+[...new Set(miss)].slice(0,8).join(", "));return null}
 const bad=unimpl(buildDeck(S.cards,d.leader,d.cards),...S.meta.map(o=>buildDeck(S.cards,o.leader,o.cards)));
 if(bad.length&&!allow){out.innerHTML=`<p><b class="e">Rifiutato:</b> ${bad.length} carte con effetti non implementati (o Leader con dati vita non validi).</p><div class="wrap"><table>${bad.slice(0,40).map(k=>`<tr><td>${k}</td><td>${esc(S.cards[k].name)}</td><td class="mu">${esc(fxNorm(S.cards[k].text).slice(0,110))}</td></tr>`).join("")}</table></div>`;return null}
 return bad}
function suiteCard(){return`<div class="card"><h3>Analisi vs meta (simulazione)</h3><p class="mu">Il mazzo scelto affronta ogni mazzo della sezione Meta, alternando primo/secondo. ${S.meta.length?"":'<span class="w">Meta vuoto: aggiungi avversari in Meta.</span>'}</p><div class="row"><label>Mazzo <select id="sd">${deckOpts(1)}</select></label><label>Partite/matchup <select id="sm"><option>500</option><option selected>1000</option><option>3000</option></select></label><label>Seed <input id="sx" type="number" value="1" style="width:80px"></label><label><input type="checkbox" id="sp"> Consenti parziale (NON attendibile)</label><button class="b p" onclick="runStats()">Analizza</button></div><div id="stout">${S.res?statHTML(S.res):""}</div></div>`}
async function runStats(){const d=getDeck($("#sd").value),out=$("#stout"),bad=prep(d,$("#sp").checked,out);if(!bad)return;
 const n=+$("#sm").value,seed=+$("#sx").value||1;
 try{const res=await runSuite(S.cards,d,S.meta,n,seed,async(oi,i)=>{out.textContent=`Matchup ${oi+1}/${S.meta.length}: ${i}/${n}…`;await new Promise(x=>setTimeout(x))});
  S.res={res,n,seed,bad,deck:{leader:d.leader,cards:{...d.cards}}};out.innerHTML=statHTML(S.res)}catch(e){out.textContent="Errore: "+(e.message||e)}}
const cardRows=a=>a.map(c=>`<tr><td>${stNm(c.id)} <span class="mu">${c.id}</span></td><td>${c.g}</td><td>${pc(c.wr1)}</td><td>${pc(c.wr0)}</td><td class="${c.d>=0?"o":"e"}">${pp(c.d)}</td></tr>`).join("")||'<tr><td colspan="5" class="mu">Campione insufficiente (servono ≥30 partite con e senza la carta).</td></tr>';
function statHTML(R){const{res,n,seed,bad,deck}=R,p=score(res),se=scoreSE(res),w=wts(res);let af=0,aw=0,sf=0,sw=0;
 for(const x of res){af+=x.s.a_first.games;aw+=x.s.a_first.wins;sf+=x.s.a_second.games;sw+=x.s.a_second.wins}
 const cs=contrib(res.map(x=>x.r)).filter(c=>c.id in deck.cards),hd="<tr><th>Carta</th><th>Partite in cui è stata vista</th><th>Win con</th><th>Win senza</th><th>Δ</th></tr>",
 worst=[...res].sort((a,b)=>a.s.winrate_a-b.s.winrate_a).slice(0,3);
 return(bad.length?`<p class="w"><b>PARZIALE – NON ATTENDIBILE:</b> effetti non simulati per ${bad.length} carte (${esc(bad.slice(0,12).join(", "))}).</p>`:"")+
 `<table><tr><td>Win rate pesato sul Meta (IC 95% appross.)</td><td><b>${pc(p)} ± ${pc(1.96*se)}</b></td></tr><tr><td>Partite simulate</td><td>${res.length*n} (${n} per matchup) · seed ${seed} · motore ${ENGINE_VERSION}</td></tr><tr><td>Per primo</td><td>${pc(aw/Math.max(af,1))} (${af} partite)</td></tr><tr><td>Per secondo</td><td>${pc(sw/Math.max(sf,1))} (${sf} partite)</td></tr></table>
 <h4>Per avversario</h4><div class="wrap"><table><tr><th>Avversario</th><th>Leader</th><th>Peso</th><th>Win rate [IC 95%]</th><th>Per primo</th><th>Per secondo</th><th>Turni</th></tr>${res.map((x,i)=>{const s=x.s;return`<tr><td>${esc(x.o.name)}</td><td>${x.o.leader}</td><td>${(100*w[i]).toFixed(0)}%</td><td>${ci(s.wins_a,n)}</td><td>${pc(s.a_first.wins/Math.max(s.a_first.games,1))}</td><td>${pc(s.a_second.wins/Math.max(s.a_second.games,1))}</td><td>${s.avg_turns.toFixed(1)}</td></tr>`}).join("")}</table></div>
 <h4>Carte con Δ più alto</h4><div class="wrap"><table>${hd}${cardRows(cs.slice(0,8))}</table></div><h4>Carte con Δ più basso</h4><div class="wrap"><table>${hd}${cardRows(cs.slice(-8).reverse())}</table></div>
 <p class="mu">Δ = win rate nelle partite in cui la carta è stata vista (mano iniziale o pescata) meno quello delle partite in cui non è mai comparsa. È una <b>stima correlazionale</b>, non un effetto causale.</p>
 <h4>Matchup peggiori</h4>${worst.map(x=>{const c=contrib([x.r]).filter(k=>k.id in deck.cards).slice(-3).reverse();return`<div class="card"><b>${esc(x.o.name)}</b> (${x.o.leader}) · ${ci(x.s.wins_a,n)}<br><span class="mu">${c.length?"Carte più deboli in questo matchup (stima): "+c.map(k=>`${stNm(k.id)} ${pp(k.d)}`).join(", ")+". Candidate da sostituire: verificalo con Ottimizzazione AI, dando più peso a questo avversario nel Meta.":"Campione insufficiente per indicare carte."}</span></div>`}).join("")}
 <p class="mu">Etichetta: SIMULAZIONE${bad.length?" (parziale)":""}. Riproducibile con lo stesso seed.</p>`}
function optView(){return`<div class="card"><h3>Ottimizzazione AI</h3><p class="mu">Ricerca locale: a ogni ciclo prova sostituzioni di 1 copia (una fuori tra le carte più deboli, una dentro tra Character/Event legali, implementati e compatibili col Leader). Accetta una modifica solo se migliora il win rate pesato sul Meta sul campione di ricerca <b>e</b> su un secondo campione indipendente; il risultato finale è misurato su partite ancora diverse. Il rumore statistico con poche partite è alto: leggi gli intervalli.</p>
<div class="row"><label>Mazzo <select id="od">${deckOpts(1)}</select></label><label>Partite/matchup <select id="on"><option>200</option><option selected>400</option><option>1000</option></select></label><label>Cicli <select id="or"><option>3</option><option selected>5</option><option>10</option></select></label><label>Candidati/ciclo <select id="ok"><option>6</option><option selected>10</option><option>20</option></select></label><label>Seed <input id="ox" type="number" value="1" style="width:80px"></label><label><input type="checkbox" id="op"> Consenti parziale (NON attendibile)</label><button class="b p" onclick="runOpt()">Ottimizza</button><button class="b" onclick="S.stop=true">Ferma</button></div><div id="oprog" class="mu"></div></div><div id="oout">${S.opt?optHTML(S.opt):""}</div>`}
async function runOpt(){const d=getDeck($("#od").value),out=$("#oout"),pg=$("#oprog"),bad=prep(d,$("#op").checked,out);if(!bad)return;
 const le=legalDeck(S.cards,S.ban,d.leader,d.cards);if(le.length)return alert("Il mazzo di partenza non è legale: "+le.slice(0,4).join("; "));
 S.stop=false;const o={n:+$("#on").value,rounds:+$("#or").value,k:+$("#ok").value,seed:+$("#ox").value||1,reset:()=>{S.stop=false}},t0=performance.now();
 try{const R=await optimize(S.cards,S.ban,d,S.meta,o,async()=>{if(S.stop)throw"stop";await new Promise(x=>setTimeout(x))},m=>{pg.textContent=m});
  R.bad=bad;R.deck={leader:d.leader,cards:{...d.cards}};R.sec=(performance.now()-t0)/1000;S.opt=R;pg.textContent="Completato.";out.innerHTML=optHTML(R)}
 catch(e){pg.textContent=e==="stop"?"Interrotto.":"Errore: "+(e.message||e)}}
function optHTML(R){const{orig,opt,moves,final,deck,bad}=R,f=(rs)=>`${pc(score(rs))} ± ${pc(1.96*scoreSE(rs))}`,
 ks=[...new Set([...Object.keys(deck.cards),...Object.keys(final)])].sort().filter(k=>(deck.cards[k]||0)!==(final[k]||0));
 return(bad.length?`<div class="card w"><b>PARZIALE – NON ATTENDIBILE:</b> ${bad.length} carte con effetti non simulati.</div>`:"")+
 `<div class="card"><h4>Risultato · ${R.hn} partite per matchup, seed ${R.seed} (indipendenti da quelli di ricerca)</h4><table><tr><td>Originale</td><td><b>${f(orig.rs)}</b></td></tr><tr><td>Ottimizzata</td><td><b>${f(opt.rs)}</b></td></tr></table>
 <p class="mu">Win rate medio pesato sul Meta, IC 95% approssimato. ${moves.length?"Se gli intervalli si sovrappongono, il miglioramento non è dimostrato.":"Nessuna modifica ha superato la validazione: lista già ottimo locale a questa risoluzione; aumenta partite o cicli."} Tempo ${R.sec.toFixed(0)}s. Etichetta: SIMULAZIONE.</p>
 <div class="wrap"><table><tr><th>Avversario</th><th>Originale</th><th>Ottimizzata</th></tr>${orig.rs.map((x,i)=>`<tr><td>${esc(x.o.name)}</td><td>${ci(x.s.wins_a,x.s.n)}</td><td>${ci(opt.rs[i].s.wins_a,opt.rs[i].s.n)}</td></tr>`).join("")}</table></div></div>
 <div class="card"><h4>Modifiche accettate</h4>${moves.map(m=>`<div>Ciclo ${m.round}: −1 ${stNm(m.out)} → +1 ${stNm(m.inn)} <span class="mu">· ricerca ${pc(m.before)}→${pc(m.after)} · conferma ${pc(m.vb)}→${pc(m.va)}</span></div>`).join("")||'<span class="mu">Nessuna.</span>'}
 ${ks.length?`<table>${ks.map(k=>`<tr><td>${stNm(k)} <span class="mu">${k}</span></td><td>${deck.cards[k]||0}</td><td>→</td><td>${final[k]||0}</td></tr>`).join("")}</table><div class="row"><button class="b p" onclick="optSave()">Salva come versione</button><button class="b" onclick="optLoad()">Apri nel Deck Builder</button></div>`:""}</div>`}
function optSave(){const n=prompt("Nome versione ottimizzata:","ottimizzato");if(!n)return;S.saved[n]={leader:S.opt.deck.leader,cards:{...S.opt.final},at:new Date().toISOString()};sv("decks",S.saved);alert("Salvato.")}
function optLoad(){S.leader=S.opt.deck.leader;S.main={...S.opt.final};S.tab="build";render()}
render();
</script></body></html>
